name: CI

on:
  push:
    tags: ["*"]
    branches: ["main"]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Type check
        run: cargo check --workspace --all-targets --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build docs
        run: uvx zensical build --clean

  images:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build images
        run: |
          podman build --target release-nightd --tag "${IMAGE_PREFIX}/nightd:${GITHUB_SHA}" .
          podman build --target release-nightctl --tag "${IMAGE_PREFIX}/nightctl:${GITHUB_SHA}" .

      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io --username "${REGISTRY_USER}" --password-stdin <<< "${REGISTRY_TOKEN}"

          for image in nightd nightctl; do
            podman tag "${IMAGE_PREFIX}/${image}:${GITHUB_SHA}" "${IMAGE_PREFIX}/${image}:latest"
            podman push "${IMAGE_PREFIX}/${image}:${GITHUB_SHA}"
            podman push "${IMAGE_PREFIX}/${image}:latest"
          done
